<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClaimSure · Claim audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F2F4F8;--surface:#FFFFFF;--sunken:#E8ECF4;--ink:#141B34;--muted:#5B6479;--line:#D7DCE7;
  --brand:#3340A0;--brand-ink:#FFFFFF;--brand-soft:#E7E9F8;
  --accent:#B87503;--accent-soft:#FCF1DC;--accent-line:#E9A92B;
  --pass:#1F7A4D;--warn:#A35F00;--fail:#BF3328;--pending:#68718A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1124;--surface:#151B33;--sunken:#1C2342;--ink:#E8EBF7;--muted:#9CA3BD;--line:#2A3358;
    --brand:#9AA3F5;--brand-ink:#0D1124;--brand-soft:#232B55;
    --accent:#F0B847;--accent-soft:#2D2918;--accent-line:#F0B847;
    --pass:#5CC98F;--warn:#F0A84A;--fail:#F2776B;--pending:#8E96B0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1124;--surface:#151B33;--sunken:#1C2342;--ink:#E8EBF7;--muted:#9CA3BD;--line:#2A3358;
  --brand:#9AA3F5;--brand-ink:#0D1124;--brand-soft:#232B55;
  --accent:#F0B847;--accent-soft:#2D2918;--accent-line:#F0B847;
  --pass:#5CC98F;--warn:#F0A84A;--fail:#F2776B;--pending:#8E96B0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.5 "Atkinson Hyperlegible","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.te{font-family:"Noto Sans Telugu","Atkinson Hyperlegible",sans-serif}
a{color:var(--brand)}
h2{font-size:19px;margin:0 0 10px;line-height:1.3}
h3{font-size:16px;margin:22px 0 10px}
.hint{color:var(--muted);font-size:14.5px;margin:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);
  border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft);filter:none}
.btn.small{padding:6px 12px;font-size:14px}
.btn[disabled],.btn.disabled{opacity:.45;cursor:not-allowed;filter:none}
.link{border:0;background:none;color:var(--brand);font-weight:700;padding:0;cursor:pointer;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:grid;grid-template-columns:auto minmax(220px,440px) 1fr auto;gap:22px;align-items:center;
  padding:10px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--brand);text-decoration:none;font-weight:700;font-size:20px}
.brand span{color:var(--ink);letter-spacing:-.01em}
.logo{width:32px;height:32px;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--sunken);border-radius:999px;padding:0 16px;height:42px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;width:100%;height:100%;outline:none}
.search:focus-within{outline:2px solid var(--brand)}
.progress{justify-self:end;display:grid;gap:5px;min-width:180px;font-size:14px;color:var(--muted)}
.progress b{color:var(--ink)}
.bar{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pass);border-radius:3px;transition:width .3s}
.me{display:flex;align-items:center;gap:10px;font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.me .nm{display:block;font-weight:700;line-height:1.2}
.me .rl{color:var(--muted);font-size:13px}
.me a{font-weight:700;text-decoration:none;margin-left:6px}
.demo-note{font-size:14px;padding:7px 22px;background:var(--accent-soft);border-bottom:1px solid var(--line)}

/* Layout */
.app{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 104px)}
.queue{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.75}
.qlist{list-style:none;margin:0;padding:6px 0;overflow:auto}
.qitem{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:center;padding:11px 16px;text-decoration:none;color:inherit;border-left:4px solid transparent}
.qitem:hover{background:var(--bg)}
.qitem[aria-current="true"]{background:var(--brand-soft);border-left-color:var(--brand)}
.score{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:18px}
.s-high{background:color-mix(in srgb,var(--fail) 15%,transparent);color:var(--fail)}
.s-med{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.s-low{background:color-mix(in srgb,var(--pass) 15%,transparent);color:var(--pass)}
.qname{display:flex;gap:8px;align-items:baseline;justify-content:space-between;font-weight:700}
.qname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{font-size:12.5px;font-weight:700;white-space:nowrap}
.st-visit{color:var(--muted);font-weight:400} .st-ready{color:var(--brand)} .st-decided{color:var(--pass)}
.qempty{padding:20px 16px;color:var(--muted)}

/* Case */
.case{min-width:0;padding:26px 34px 72px}
.wrap{max-width:1060px}
.back{display:none;border:0;background:none;color:var(--brand);font-weight:700;padding:0;margin-bottom:14px;cursor:pointer}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.head h1{margin:0;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.head .sub{margin:6px 0 0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:15px}
.meta span{color:var(--muted)}
.dial{--v:0;--c:var(--pass);width:100px;height:100px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--sunken) 0);display:grid;place-items:center;flex:none}
.dial div{width:82px;height:82px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center;line-height:1.05}
.dial b{font-size:30px}
.dial span{font-size:12px;color:var(--muted)}

.next{margin:22px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-left:6px solid var(--accent-line);border-radius:12px;padding:14px 18px}
.next.done{border-left-color:var(--pass)}
.next p{margin:0}
.next .t{font-weight:700;font-size:17px}
.next .d{color:var(--muted);font-size:15px}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:0 0 22px;padding:4px;background:var(--sunken);border-radius:14px}
.step{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:700;min-width:0;text-align:left}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;background:var(--surface);border:1px solid var(--line);flex:none}
.step .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.step[aria-selected="true"] .n{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.step .dot{width:9px;height:9px;border-radius:50%;margin-left:auto;flex:none}
.d-fail{background:var(--fail)} .d-warn{background:var(--warn)} .d-pass{background:var(--pass)} .d-pending{background:transparent;border:2px solid var(--line)}

/* Findings */
.group-h{display:flex;align-items:center;gap:10px;margin:24px 0 10px}
.group-h:first-child{margin-top:0}
.group-h h2{margin:0}
.count{font-size:13px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.finds{display:grid;gap:8px}
.find{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px}
.i-fail{background:color-mix(in srgb,var(--fail) 15%,transparent);color:var(--fail)}
.i-warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.i-pass{background:color-mix(in srgb,var(--pass) 15%,transparent);color:var(--pass)}
.i-pending{background:var(--sunken);color:var(--pending)}
.find .t{font-weight:700}
.find .tag{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.find .d{color:var(--muted);font-size:15px;margin-top:2px}
.find ul{margin:8px 0 0;padding-left:18px;font-size:15px}
.find li+li{margin-top:3px}
details.passed>summary{cursor:pointer;font-weight:700;margin:24px 0 10px;color:var(--muted)}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:13.5px;color:var(--muted);font-weight:700;background:var(--bg)}
tbody th{font-weight:700;color:var(--muted)}
tr:last-child td,tr:last-child th{border-bottom:0}
td.bad{color:var(--fail);font-weight:700;background:color-mix(in srgb,var(--fail) 8%,transparent)}
.section{margin-top:28px}

/* Field visit */
.seg{display:inline-flex;padding:4px;background:var(--sunken);border-radius:12px;gap:4px;margin-bottom:18px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.seg .mini{font-size:12.5px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--bg);color:var(--muted)}
.parthead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.parthead p{max-width:62ch}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start}
.slot.missing{border-style:dashed;border-width:1.5px}
.slot.wide{grid-column:1/-1;grid-template-columns:minmax(200px,320px) minmax(0,1fr);column-gap:18px}
.slot.wide>*{grid-column:1}
.slot.wide>.slot-h{grid-column:1/-1}
.slot.wide>.readcard{grid-column:2;grid-row:span 2;border-top:0;padding-top:0;align-self:start}
.slot-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.slot-h b{font-size:15px;line-height:1.35}
.req{font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--accent)}
.req.opt{color:var(--muted);font-weight:400}
.req.ok{color:var(--pass)}
.readtag{font-size:12.5px;color:var(--brand);font-weight:700}
.ph{margin:0;display:grid;gap:6px}
.thumb{padding:0;border:0;background:none;cursor:zoom-in;border-radius:8px;overflow:hidden;display:block}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--sunken)}
.ph figcaption{font-size:13px;color:var(--muted);line-height:1.45}
.far{color:var(--warn);font-weight:700}
.samp{color:var(--accent);font-weight:700}
.cap{width:100%}
.consent{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:700;cursor:pointer}
.consent input{width:18px;height:18px;margin-top:3px;accent-color:var(--brand)}
.consent small{display:block;font-weight:400;color:var(--muted);font-size:14px}

.readcard{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.rc-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:0;font-size:14.5px}
.rc-m{font-size:12.5px;color:var(--muted)}
.rc-ok{color:var(--pass)} .rc-bad{color:var(--fail)} .rc-unsure{color:var(--warn)}
.rt{font-size:13.5px}
.rt th,.rt td{padding:6px 8px}
.rt tbody th{font-weight:700}
.rt small{display:block;font-size:12px;font-weight:700}
.rt tr.r-fail td:last-child{color:var(--fail);font-weight:700}
.rt tr.r-warn td:last-child{color:var(--warn)}
.rt input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13.5px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.visit{display:grid;gap:12px;max-width:680px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.q .ql{display:block;font-weight:700;margin-bottom:8px}
.yn{display:flex;gap:8px}
.yn label{flex:1;max-width:160px}
.yn input{position:absolute;opacity:0}
.yn span{display:block;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:700}
.yn input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.yn input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.q input[type=number],.q textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.q textarea{min-height:76px;resize:vertical}

/* Decide */
.decide{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:24px;align-items:start}
.choose{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;position:sticky;top:90px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--brand);width:17px;height:17px}
.opt b{display:block}
.opt small{display:block;color:var(--muted);font-size:13.5px}
.opt em{font-style:normal;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-left:6px}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.choose textarea{width:100%;min-height:80px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
.lbl{font-weight:700;font-size:14.5px}

.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px 34px;position:relative;overflow:hidden;font-size:15px}
.report section{margin-top:26px}
.report h2{font-size:15px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);letter-spacing:.01em}
.report p{margin:4px 0}
.dh{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap;padding-bottom:14px;border-bottom:3px solid var(--brand)}
.dh-brand{display:flex;gap:10px;align-items:center;color:var(--brand)}
.dh-brand svg{width:34px;height:34px}
.dh-brand b{display:block;color:var(--ink);font-size:18px;line-height:1.1}
.dh-brand span{color:var(--muted);font-size:13.5px}
.dh-ref{display:grid;grid-template-columns:repeat(3,auto);gap:2px 18px;margin:0;font-size:13px}
.dh-ref dt{color:var(--muted)}
.dh-ref dd{margin:0;font-weight:700}
.dtitle{font-size:24px;line-height:1.2;margin:18px 0 2px}
.dsub{color:var(--muted);margin:0}
.glance{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:10px;margin-top:18px;overflow:hidden}
.g-out{padding:16px 18px;background:var(--brand-soft);display:grid;gap:6px;align-content:start}
.g-lbl{font-size:12.5px;color:var(--muted);font-weight:700}
.g-out .big{font-size:20px;font-weight:700;line-height:1.2}
.g-out .why{color:var(--muted);font-size:14px}
.g-kpis{display:grid;grid-template-columns:1fr 1fr}
.kpi{padding:12px 16px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi:nth-child(n+3){border-bottom:0}
.kpi b{display:block;font-size:19px;line-height:1.2}
.kpi small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.kpi .lv-high{color:var(--fail)} .kpi .lv-med{color:var(--warn)} .kpi .lv-low{color:var(--pass)}
.kf{margin:0;padding-left:22px;display:grid;gap:6px}
.kf .tagf{font-weight:700}
.tf{color:var(--fail)} .tw{color:var(--warn)} .tp{color:var(--pass)} .tq{color:var(--pending)}
.report table{font-size:13.5px}
.report th,.report td{padding:7px 10px}
.kv th{width:20%;color:var(--muted);font-weight:700;background:none}
.kv td{width:30%}
.ct td:first-child,.ct th:first-child{width:28px;color:var(--muted)}
.ct .res{font-weight:700;white-space:nowrap}
.ct ul{margin:4px 0 0;padding-left:16px}
.rphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rphotos figure{margin:0;break-inside:avoid}
.rphotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--line)}
.rphotos figcaption{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:4px}
.rphotos figcaption b{color:var(--ink)}
.stamp{display:inline-block;justify-self:start;transform:rotate(-4deg);border:3px double currentColor;border-radius:10px;padding:5px 14px;font-weight:700;font-size:16px;letter-spacing:.04em;line-height:1.15;text-align:center;background:color-mix(in srgb,currentColor 7%,transparent);margin-top:4px}
.stamp small{display:block;font-size:11px;letter-spacing:0;font-weight:400}
.stamp.v-pass{color:var(--pass)} .stamp.v-recover{color:var(--warn)} .stamp.v-refer{color:var(--fail)} .stamp.v-hold{color:var(--brand)}
.watermark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:120px;font-weight:700;color:var(--ink);opacity:.045;transform:rotate(-28deg);letter-spacing:.08em}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sigbox{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:10px;font-size:13.5px}
.sigbox b{font-size:14px}
.sigline{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:end}
.sigline span{color:var(--muted)}
.sigline i{border-bottom:1px solid var(--muted);min-height:22px;font-style:normal}
.annex p{font-size:13px;color:var(--muted)}
.report .hint{font-size:.88em}
.report td .hint,.report td small{font-size:.92em}
.dfoot{margin-top:24px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* Welcome */
.welcome{max-width:620px;padding:40px 0}
.welcome h1{font-size:34px;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
.welcome p{color:var(--muted);font-size:17px;margin:0 0 20px}
.how{list-style:none;padding:0;margin:32px 0 0;display:grid;gap:14px}
.how li{display:grid;grid-template-columns:30px 1fr;gap:12px}
.how .n{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:14px}
.how b{display:block}
.how span{color:var(--muted);font-size:15px}

/* Toast and dialog */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);
  padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--fail);color:#fff}
dialog#viewer{border:0;border-radius:12px;padding:14px;max-width:min(92vw,980px);background:var(--surface);color:var(--ink)}
dialog#viewer::backdrop,dialog#importer::backdrop{background:rgb(0 0 0/.6)}
dialog#importer{border:0;border-radius:14px;padding:22px 24px;width:min(960px,96vw);max-height:92vh;background:var(--bg);color:var(--ink)}
#impbody{display:grid;gap:14px}
#impbody h3{font-size:16px;margin:8px 0 0}
.imp-h{display:flex;justify-content:space-between;align-items:center}
.imp-h h2{margin:0;font-size:21px}
.imp-steps{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.imp-steps li{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.imp-steps li span{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sunken);font-size:12px;font-weight:700}
.imp-steps li.on{color:var(--ink);border-color:var(--brand);font-weight:700}.imp-steps li.on span{background:var(--brand);color:var(--brand-ink)}
.imp-steps li.done span{background:var(--pass);color:#fff}
.clients{display:grid;gap:8px}
.drop{display:grid;gap:4px;place-items:center;text-align:center;padding:24px;border:2px dashed var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.drop:hover,.drop:focus-within{border-color:var(--brand)}
.drop input{max-width:100%}.drop span{color:var(--muted);font-size:14px}
.maptab select{width:100%;min-width:180px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.maptab tr.bad th{color:var(--fail)}
.req{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px;margin-left:4px}
.imp-warn{margin:0;color:var(--fail);font-weight:700}
.imp-note{margin:0;padding:10px 12px;border-radius:10px;background:var(--brand-soft);font-size:14px}
.imp-sum{display:grid;grid-template-columns:auto auto 1fr;gap:10px}
.imp-sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.imp-sum b{display:block;font-size:22px;line-height:1.2}.imp-sum div:last-child b{font-size:16px}
.imp-sum span{color:var(--muted);font-size:13.5px}.imp-sum .b b{color:var(--fail)}
.imp-list{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px}
.qtools{display:flex;gap:10px;align-items:center;padding:12px 14px 0;flex-wrap:wrap}.qtools:empty{display:none}
.qtools .hint{font-size:13px}
.nhaform .formtab{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px 14px}
.nhaform h3{font-size:14.5px;margin:14px 0 2px;color:var(--brand)}
.fq{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.fq:last-of-type{border-bottom:0}
.fn{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunken);font-size:12.5px;font-weight:700;color:var(--muted)}
.fq .ft{display:grid;gap:5px;font-size:14.5px;grid-column:span 1}
.fq:not(:has(.fn)) .ft{grid-column:1/3}
.sug{font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);justify-self:start}
.sug.no{background:color-mix(in srgb,var(--fail) 10%,transparent);color:var(--fail)}
.rmk{font:inherit;font-size:13.5px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:460px}
.yn.sm label span{padding:6px 14px;font-size:14px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:10px 0}
.fgrid label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.fgrid input,.fgrid select{font:inherit;font-size:14.5px;font-weight:400;color:var(--ink);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#damt{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:220px}
.report .annex{break-before:auto}
.at td:first-child{width:auto}.at td:last-child{width:34%}.at th:last-child{width:34%}
.report table.at{font-size:13px}
.tag.nha{background:var(--brand-soft);color:var(--brand);margin-left:6px}
.doclist{display:flex;flex-wrap:wrap;gap:6px}
.docitem{font-size:13.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.docitem.ok{color:var(--pass)}.docitem.no{color:var(--fail);border-color:var(--fail);font-weight:700}.docitem.wait{color:var(--pending)}
.qreason{display:block;font-size:12.5px;color:var(--accent);margin-top:2px}
dialog#viewer img{max-width:100%;max-height:70vh;display:block;margin:0 auto 10px;border-radius:6px}
dialog#viewer p{font-size:14px;color:var(--muted);margin:0 0 12px}

@media (max-width:1100px){
  .top{grid-template-columns:auto minmax(0,1fr) auto}
  .progress{display:none}
  .decide{grid-template-columns:1fr}
  .choose{position:static}
}
@media (max-width:820px){
  .top{grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 14px;position:static}
  .me{grid-column:1/-1;justify-content:space-between}
  .demo-note{padding:7px 14px}
  .imp-sum{grid-template-columns:1fr 1fr}.imp-sum div:last-child{grid-column:1/-1}
  dialog#importer{padding:16px}
  .app{grid-template-columns:1fr}
  .app.showing .queue{display:none}
  .app:not(.showing) .case{display:none}
  .back{display:inline-block}
  .case{padding:16px 16px 56px}
  .head{grid-template-columns:minmax(0,1fr) auto;gap:12px}
  .head h1{font-size:24px}
  .meta{gap:2px 14px;font-size:14px}
  .dial{width:72px;height:72px}.dial div{width:58px;height:58px}.dial b{font-size:21px}.dial span{font-size:10.5px}
  .next{grid-template-columns:1fr}
  .steps{display:flex;overflow-x:auto;scrollbar-width:none}
  .step{padding:8px 12px;flex:none}
  .step .lb{overflow:visible}
  .slot.wide{grid-template-columns:1fr}
  .slot.wide>.readcard{grid-column:1;grid-row:auto;border-top:1px solid var(--line);padding-top:10px}
  .report{padding:20px 16px}
  .glance{grid-template-columns:1fr}
  .signs{grid-template-columns:1fr}
  .dh-ref{grid-template-columns:repeat(3,auto)}
}
@page{size:A4;margin:16mm 14mm 18mm;
  @bottom-left{content:"ClaimSure claim audit report · Confidential";font-family:"Atkinson Hyperlegible",Arial,sans-serif;font-size:8.5pt;color:#5B6479}
  @bottom-right{content:"Page " counter(page) " of " counter(pages);font-family:"Atkinson Hyperlegible",Arial,sans-serif;font-size:8.5pt;color:#5B6479}}
@media print{
  :root:not([data-print]){--bg:#fff;--surface:#fff;--sunken:#EEF0F5;--ink:#141B34;--muted:#4F586C;--line:#CBD2DF;--brand:#3340A0;--brand-soft:#ECEEFA;--accent:#9A6200;--pass:#1A6B43;--warn:#8F5400;--fail:#B02E24;--pending:#5C6478;color-scheme:light}
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before,.top,.demo-note,.queue,#importer,.back,.head,.next,.steps,.choose,.toast,#viewer{display:none!important}
  .app,.decide,.case,.wrap{display:block;padding:0;margin:0;max-width:none;min-height:0}
  .report{border:0;border-radius:0;padding:0;font-size:10pt;overflow:visible}
  .report section{margin-top:14pt}
  .report h2{font-size:11pt;break-after:avoid}
  .dtitle{font-size:17pt}
  .report table{font-size:9pt}
  .report .hint{font-size:8.5pt}
  .kpi b{font-size:13pt}
  .tablewrap{border-radius:4px;overflow:visible}
  tr,figure,.sigbox,.glance{break-inside:avoid}
  thead{display:table-header-group}
  .report h2+p.hint{break-after:avoid}
  .signs,.report section:has(.signs){break-inside:avoid}
  .watermark{position:fixed;font-size:110pt;opacity:.06}
  .glance{grid-template-columns:1.15fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const requiredDocs=code=>DOC_COMMON.concat(REQ_DOCS[String(code||"").toUpperCase()]||[]);

function sampleDesk(o){
  const surg=SURGICAL.includes(o.pkg.code),n=Math.round((Date.parse(o.dates.discharge)-Date.parse(o.dates.admit))/864e5);

const READ_FIELDS={register:["name","age","gender","admit","discharge","diagnosis","doctor"],casesheet:["name","age","gender","admit","discharge","diagnosis","procedure","doctor"]};
const FLABEL={name:"Patient name",age:"Age",gender:"Sex",admit:"Admitted",discharge:"Discharged",diagnosis:"Diagnosis",procedure:"Procedure",doctor:"Doctor"};
function claimVal(c,k){return {name:c.patient.name,age:c.patient.age,gender:c.patient.gender,admit:c.dates.admit,discharge:c.dates.discharge,diagnosis:c.diagnosis,procedure:c.pkg.name,doctor:c.doctor}[k];}

  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;

  return "";

function parseText(text){
  const lines=String(text||"").split(/\n/).map(l=>l.trim()).filter(Boolean);
  const get=re=>{for(const l of lines){const m=l.match(re);if(m)return m[1].trim();}return "";};
  const D="([0-9]{1,2}\\s*[\\/\\-.]\\s*[0-9]{1,2}\\s*[\\/\\-.]\\s*[0-9]{2,4})";
  const clean=s=>s.replace(/\s+/g,"");
  const age=get(/\bage\s*[:;]?\s*(\d{1,3})/i), sex=get(/\b(?:sex|gender)\s*[:;]?\s*([a-z]+)/i);
  return {
    name:get(/(?:patient'?s?\s*name|name)\s*[:;]\s*(.+)$/i).replace(/[^A-Za-z .]/g,"").trim(),
    age:age?Number(age):null,
    gender:sex?(/^f/i.test(sex)?"F":/^m/i.test(sex)?"M":""):"",
    admit:toISO(clean(get(new RegExp("(?:date\\s*of\\s*admission|admitted\\s*on|d\\.?o\\.?a\\.?)\\s*[:;]?\\s*"+D,"i")))),
    discharge:toISO(clean(get(new RegExp("(?:date\\s*of\\s*discharge|discharged\\s*on|d\\.?o\\.?d\\.?)\\s*[:;]?\\s*"+D,"i")))),
    diagnosis:get(/diagnosis\s*[:;]\s*(.+)$/i),
    procedure:get(/(?:procedure|operation|surgery)\s*[:;]\s*(.+)$/i),
    doctor:get(/(?:consultant|surgeon|treating\s*doctor|doctor)\s*[:;]\s*(.+)$/i)

}

const words=s=>String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>1&&!["dr","the","and","with","of"].includes(w));
const near=(a,b)=>a===b||(a.length>=5&&lev(a,b)<=1);

function lateralityConflict(cl,pg){const a=sides(cl),b=sides(pg);
  if(a.both&&!b.both&&(b.right!==b.left))return `Claim says both sides; page says ${b.right?"right":"left"} only`;
  if(!a.both&&!b.both&&a.right!==a.left&&b.right!==b.left&&a.right!==b.right)return "Different side";
  return "";}
function comparePage(c,kind,f){
  return (READ_FIELDS[kind]||[]).map(k=>{

function parseCSV(text){

  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;continue;}
    if(ch==='"')q=true;else if(ch===delim){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";}

function anyDate(v){
  if(v==null||v==="")return "";
  if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(typeof v==="number"&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v).trim().replace(/\s+\d{1,2}:\d{2}.*$/,"");
  let m=s.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/);if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})[\s\-\/.]([A-Za-z]{3})[A-Za-z]*[\s\-\/.,]+(\d{2,4})$/);if(m&&MONS[m[2].toLowerCase()])return `${m[3].length===2?"20"+m[3]:m[3]}-${String(MONS[m[2].toLowerCase()]).padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  const iso=toISO(s);if(!iso)return "";
  const [y,mo,d]=iso.split("-").map(Number);return (mo>=1&&mo<=12&&d>=1&&d<=31&&y>1990&&y<2100)?iso:"";
}

function checkRows(table,map,clientId){
  const out=[],seen=new Set(),existing=new Set(CLAIMS.map(c=>c.id));let masked=0;
  table.slice(1).forEach((cells,i)=>{
    const g=k=>map[k]==null?"":cells[map[k]],str=k=>String(g(k)??"").trim();
    const r={client:clientId},errs=[],warns=[];
    r.id=str("id");if(!r.id)errs.push("No claim ID.");else if(seen.has(r.id))errs.push("Claim ID appears twice in the file.");else if(existing.has(r.id))errs.push("This claim is already in your cases.");
    seen.add(r.id);
    r.name=str("name");if(!r.name)errs.push("No patient name.");
    const age=Number(str("age"));if(str("age")==="")errs.push("No age.");else if(!Number.isInteger(age)||age<0||age>120)errs.push(`Age “${str("age")}” isn’t a whole number between 0 and 120.`);else r.age=age;
    const sx=str("gender");r.gender=/^(m|male)$/i.test(sx)?"M":/^(f|female)$/i.test(sx)?"F":/^(t|o|other|transgender)/i.test(sx)?"O":"";if(!r.gender)errs.push(`Sex “${sx}” should be M, F or Other.`);
    const ad=str("aadhaar").replace(/\D/g,"");if(ad.length>=12)masked++;r.aadhaar=ad.length>=4?ad.slice(-4):"";
    ["village","district","hospital","diagnosis","doctor","reason","pkgName","benId","familyId"].forEach(k=>r[k]=str(k));
    const yn=k=>{const s=str(k);return /^(y|yes|true|1|done|verified)$/i.test(s)?true:/^(n|no|false|0|not done|skipped)$/i.test(s)?false:null;};
    r.bioAdmit=yn("bioAdmit");r.bioDischarge=yn("bioDischarge");
    if(!r.hospital)errs.push("No hospital.");
    r.pkgCode=str("pkgCode").toUpperCase();if(!r.pkgCode)errs.push("No package code.");
    const rate=money(g("pkgRate"));if(Number.isNaN(rate))errs.push(`Package rate “${str("pkgRate")}” isn’t a number.`);else r.pkgRate=rate;
    if(r.pkgCode&&!r.pkgRate&&!PKG_BY_CODE[r.pkgCode])warns.push(`Package ${r.pkgCode} has no rate, so the billing check is limited.`);
    [["admit","Admission date",1],["surgery","Surgery date",0],["discharge","Discharge date",1]].forEach(([k,l,req])=>{const raw=g(k),d=anyDate(raw);
      if(d)r[k]=d;else if(String(raw??"").trim()!=="")errs.push(`${l} “${raw}” isn’t a date we can read.`);else if(req)errs.push(`No ${l.toLowerCase()}.`);});
    const amt=money(g("amount"));if(amt==null)errs.push("No amount claimed.");else if(Number.isNaN(amt)||amt<=0)errs.push(`Amount “${str("amount")}” isn’t a number.`);else r.amount=amt;
    const bill=money(g("billAmount"));if(Number.isNaN(bill))warns.push("Hospital bill amount isn’t a number, so it was left out.");else r.billAmount=bill;
    out.push({line:i+2,r,errs,warns});
  });
  return {rows:out,masked};
}

  add("Billing","Amount fits the package and the hospital ledger",bs,bs==="pass"?`${inr(c.claimAmount)} is within the package rate of ${inr(c.pkg.rate)}.`:bs==="warn"?"Billing can only be partly checked.":"Billing problem found.",bE);

  const fE=[];let fs="pass";
  c.files.forEach(f=>{if(EDITORS.includes(f.producer)){const gap=(f.created&&f.modified)?Math.round(t(f.modified)-t(f.created)):0;
    if(gap>=1){fs="fail";fE.push(`${f.name} was edited with ${f.producer} ${gap} day(s) after it was issued (${day(f.created)} to ${day(f.modified)}).`);}
    else{if(fs!=="fail")fs="warn";fE.push(`${f.name} was last saved with ${f.producer}.`);}}});
  if(!c.files.length)fs="pending";
  add("File tampering","Files weren’t edited after they were issued",fs,fs==="pending"?"No claim documents attached yet.":fs==="pass"?"File details look original.":"Signs of editing in the file details.",fE);

  const sE=[];let sts="pass";
  c.files.filter(f=>f.stamp!=null).forEach(f=>{if(f.stamp<0.75){sts="fail";sE.push(`${f.name}: the hospital stamp matches its reference only ${Math.round(f.stamp*100)}%.`);}else if(f.stamp<0.9){if(sts!=="fail")sts="warn";sE.push(`${f.name}: stamp match ${Math.round(f.stamp*100)}%.`);}});
  if(!c.files.length)sts="pending";
  add("Visual consistency","Hospital stamp matches its reference",sts,sts==="pending"?"No claim documents attached yet.":sts==="pass"?"Stamps match the hospital’s reference copy.":"Stamp differs from the hospital’s reference.",sE);

  const uE=[];let us="pass";
  c.files.forEach(f=>{const others=(hashIndex[f.hash]||[]).filter(x=>x!==c.id);if(others.length){us="fail";uE.push(`${f.name} is identical to a file in ${others.join(", ")}.`);}});
  photosOf(c.id).forEach(p=>{const others=PHOTOS.filter(o=>o.hash===p.hash&&o.id!==p.id);
    if(others.length){us="fail";const where=[...new Set(others.map(o=>o.caseId===c.id?`this case (${slotOf(o.slot).label})`:o.caseId))];uE.push(`Visit photo “${slotOf(p.slot).label}” is identical to a photo in ${where.join(", ")}.`);}});
  add("Duplicates","No image reused from another claim",us,us==="pass"?"No matching images in other claims or visits.":"The same image appears more than once.",uE);

  const pages=photosOf(c.id).filter(p=>slotOf(p.slot).read),reads=readsOf(c.id);
  if(!pages.length){add("Page reading","Register and case sheet match the claim","pending","Photograph the admission register and case sheet. The app reads them and checks them against the claim.",[]);}
  else{let ps="pass",unread=0;const pe=[];
    pages.forEach(p=>{const r=reads[p.id];if(!r){unread++;return;}
      comparePage(c,p.slot,r.fields).forEach(x=>{
        if(x.st==="fail"){ps="fail";pe.push(`${slotOf(p.slot).short} shows ${x.label.toLowerCase()} “${fmtVal(x.k,x.page)}”; the claim says “${fmtVal(x.k,x.claim)}”.`);}
        else if(x.st==="warn"){if(ps==="pass")ps="warn";pe.push(`${slotOf(p.slot).short}: ${x.label.toLowerCase()}, ${x.note.toLowerCase()}.`);}});});
    if(unread&&ps==="pass")ps="pending";
    add("Page reading","Register and case sheet match the claim",ps,ps==="pass"?"Name, dates and treatment on the hospital’s own pages match the claim.":ps==="pending"?`${unread} page(s) not read yet.`:ps==="fail"?"The hospital’s own pages contradict the claim.":"Some details couldn’t be confirmed on the pages.",pe);}

  const ph=photosOf(c.id);
  if(!ph.length){add("Visit evidence","Visit photos are complete and taken on site","pending","No photos yet. Take them during the hospital and home visits.",[]);}
  else{const eE=[];let es="pass";const miss=missingSlots(c);
    if(miss.length){es="warn";eE.push(`${miss.length} required photo(s) missing: ${miss.map(x=>x.label.toLowerCase()).join("; ")}.`);}
    const hg=HOSP_GEO[c.hospital];
    ph.forEach(p=>{const sl=slotOf(p.slot);if(p.lat==null){es="warn";eE.push(`${sl.label}: no location recorded.`);}
      else if(hg&&sl.visit==="hospital"){const km=distKm([p.lat,p.lng],hg);if(km>2){es="warn";eE.push(`${sl.label}: taken ${fmtKm(km)} from the hospital.`);}}});
    add("Visit evidence","Visit photos are complete and taken on site",es,es==="pass"?`${ph.length} photos, all required shots present and taken on site.`:"Photo evidence needs attention.",eE);}

  if(v.status!=="done"){add("Home visit","Patient confirms the treatment","pending","Home visit not done yet.",[]);}
  else{const hE=[];let hs="pass";
    if(v.admitted==="no"){hs="fail";hE.push("The patient says they were never admitted.");}
    if(Number(v.paid)>0){hs="fail";hE.push(`The patient paid ${inr(v.paid)} under a cashless scheme${v.purpose?`, for ${String(v.purpose).toLowerCase()}`:""}.`);}
    else if(v.moneyAsked==="yes"){hs="fail";hE.push("The hospital asked the patient for money.");}
    if(v.sameHosp==="no"){hs="fail";hE.push(`The patient says they were treated at ${v.otherHosp||"a different hospital"}, not ${shortHosp(c.hospital)}.`);}
    if(v.availed==="yes"&&isSurg(c)&&v.surgery==="no"){hs="fail";hE.push("The patient says no surgery was done, but a surgical package was claimed.");}
    if(v.ownCost==="yes"){hs="fail";hE.push("The patient bought medicines or tests at their own cost.");}
    if(v.surgery==="yes"&&v.scar==="no"&&c.pkg.code!=="OP004"){if(hs!=="fail")hs="warn";hE.push("No surgical scar was seen.");}
    if(v.pAdmit&&Math.abs(t(v.pAdmit)-t(c.dates.admit))>2){if(hs!=="fail")hs="warn";hE.push(`The patient recalls admission on ${day(v.pAdmit)}; the claim says ${day(c.dates.admit)}.`);}
    if(v.food==="no"){if(hs!=="fail")hs="warn";hE.push("Free food and travel allowance weren’t provided.");}
    if(v.postMeds==="no"){if(hs!=="fail")hs="warn";hE.push("No medicines were given after discharge.");}
    if(v.admitted==="yes"&&v.stay!==""&&v.stay!=null&&n!=null&&Math.abs(Number(v.stay)-n)>1){if(hs!=="fail")hs="warn";hE.push(`The patient recalls ${v.stay} day(s); the record shows ${n} night(s).`);}
    if(v.papers==="no"&&hs==="pass"){hs="warn";hE.push("The patient has no discharge papers.");}
    add("Home visit","Patient confirms the treatment",hs,hs==="pass"?"The patient confirmed the admission and paid nothing.":"The home visit raised problems.",hE);}

  const ra=ruleAnswers(c.id);
  ruleQuestions(c).forEach(q=>{const a=ra[q.id],nm=RULESETS[q.set].name;
    add("Scheme rules",q.text,a==="yes"?"pass":a==="no"?"fail":"pending",a==="yes"?`Confirmed on the hospital visit (${nm} rule).`:a==="no"?`Not met. This is a ${nm} scheme rule.`:`${nm} rule. Answer it on the hospital visit.`,a==="no"?[q.ask.replace(/\?$/,"")+": no."]:[]);});
  nhaFormChecks(c,add,out);
  nhaChecks(c,add);
  ruleQuestions(c).forEach(q=>{const k=out.find(x=>x.group==="Scheme rules"&&x.title===q.text);if(k)k.basis=q.basis||(RULESETS[q.set].name+" scheme rule");});
  return out;
}
function score(checks){let s=0;checks.forEach(k=>{if(k.status==="fail")s+=isCrit(k)?50:30;else if(k.status==="warn")s+=12;});return Math.min(100,s);}
const band=s=>s>=50?"high":s>=20?"med":"low";
const BAND={high:"High risk",med:"Medium risk",low:"Low risk"};
let STATE=new Map();
function computeAll(){STATE=new Map();CLAIMS.forEach(c=>{const checks=runChecks(c),s=score(checks);STATE.set(c.id,{checks,score:s,band:band(s)});});}
const stateOf=c=>STATE.get(c.id);

/* ---------- Workflow ---------- */
const STAGE={desk:"Needs desk audit",visit:"Needs field visit",ready:"Ready to decide",decided:"Decided"};
function stageOf(c){if(decisionOf(c))return "decided";if(!deskDone(c))return "desk";return fieldTodo(c).length?"visit":"ready";}
function ordered(){return CLAIMS.slice().sort((a,b)=>{const da=decisionOf(a)?1:0,db=decisionOf(b)?1:0;if(da!==db)return da-db;return stateOf(b).score-stateOf(a).score||a.id.localeCompare(b.id);});}
function nextCase(c){return ordered().find(x=>x.id!==(c&&c.id)&&!decisionOf(x));}
const OPTIONS=[
  {v:"Dismiss (non-fraud)",d:"The claim is genuine. It returns to normal processing.",cls:"v-pass"},
  {v:"Process with partial amount",d:"Approve a reduced amount. Enter the recommended approval amount.",cls:"v-recover"},
  {v:"Confirm fraud and reject",d:"Evidence shows fraud. Reject, recover if already paid, and refer the hospital for action.",cls:"v-refer"},
  {v:"Send for field investigation",d:"Not enough evidence yet. Investigate in the field before deciding.",cls:"v-hold"}];
function suggest(st,c){
  const fails=st.checks.filter(k=>k.status==="fail");
  if(fails.some(isCrit))return {v:"Confirm fraud and reject",why:"Fraud signals found, not just a billing error."};
  if(fails.length)return {v:"Process with partial amount",why:"Billing or document errors without signs of fraud."};
  if(c&&visitOf(c).status!=="done")return {v:"Send for field investigation",why:"The field visit hasn’t been done yet."};
  if(st.checks.some(k=>k.status==="pending"))return {v:"Send for field investigation",why:"Some evidence is still missing."};
  if(st.checks.some(k=>k.status==="warn"))return {v:"Dismiss (non-fraud)",why:"Only minor points remain. Note them in the reason."};
  return {v:"Dismiss (non-fraud)",why:"Every check passed."};
}
function nextStep(c,st){
  const dec=decisionOf(c);
  if(dec){const nx=nextCase(c);return {done:true,t:`Decided: ${dec.verdict}.`,d:nx?`Next up: ${nx.patient.name} (risk ${stateOf(nx).score}).`:"That was the last open case.",label:nx?"Open next case":"",act:"next"};}
  const fails=st.checks.filter(k=>k.status==="fail").length;
  if(!deskDone(c)){const dk=deskOf(c)||{},left=DESK_QS.filter(q=>!dk[q.id]).length;
    return {t:"Start with the desk audit.",d:`${11-left} of 11 checklist questions answered. ClaimSure pre-fills the ones it can verify.`,label:"Open desk audit",act:"docs"};}
  const todo=fieldTodo(c);
  if(todo.length){
    return {t:fails?`${fails} problem${fails>1?"s":""} found. Confirm on the field visit.`:"The documents look fine. Confirm on the field visit.",d:`Still needed: ${todo.join(" and ")}.`,label:"Go to field visit",act:"field"};}
  return {t:"Evidence is complete. Record your decision.",d:`Suggested: ${suggest(st,c).v}.`,label:"Decide now",act:"decide"};
}
function tabDot(c,st,tab){
  const worst=list=>list.some(k=>k.status==="fail")?"fail":list.some(k=>k.status==="warn")?"warn":list.some(k=>k.status==="pending")?"pending":"pass";
  if(tab==="review")return worst(st.checks);
  if(tab==="docs")return worst(st.checks.filter(k=>TAB_FOR[k.group]==="docs"));
  if(tab==="field")return !fieldTodo(c).length?worst(st.checks.filter(k=>TAB_FOR[k.group]==="field")):"pending";
  return decisionOf(c)?"pass":"pending";
}

/* ---------- Rendering ---------- */
const UI={filter:"all",query:"",tab:"review",part:"hospital",lang:"en",editing:null};
const currentCase=()=>CLAIMS.find(x=>x.id===location.hash.slice(1));
function renderAll(){computeAll();renderTop();renderFilters();renderQueue();renderCase();}

function renderTop(){
  const done=CLAIMS.filter(decisionOf).length,pct=Math.round(done/CLAIMS.length*100);
  document.getElementById("progress").innerHTML=`<span><b>${done} of ${CLAIMS.length}</b> cases decided</span><span class="bar"><i style="width:${pct}%"></i></span>`;
}
function renderFilters(){
  const cnt={all:CLAIMS.length,high:0,desk:0,visit:0,ready:0,decided:0,imported:CLAIMS.filter(c=>c.source==="import").length};
  CLAIMS.forEach(c=>{if(stateOf(c).band==="high"&&!decisionOf(c))cnt.high++;cnt[stageOf(c)]++;});
  const F=[["all","All"],["high","High risk"],["desk","Desk audit"],["visit","Needs visit"],["ready","Ready"],["decided","Decided"]].concat(cnt.imported?[["imported","Imported"]]:[]);
  document.getElementById("qtools").innerHTML=canImport()?`<button class="btn ghost small" data-imp="open" title="Upload a CSV or Excel case list from the client">Import cases</button>`:"";
  document.getElementById("filters").innerHTML=F.map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${UI.filter===k}">${l} <b>${cnt[k]}</b></button>`).join("");
}
function renderQueue(){
  const sel=location.hash.slice(1),q=UI.query.toLowerCase();
  const items=ordered().filter(c=>{
    if(UI.filter==="high"&&(stateOf(c).band!=="high"||decisionOf(c)))return false;
    if(["desk","visit","ready","decided"].includes(UI.filter)&&stageOf(c)!==UI.filter)return false;
    if(UI.filter==="imported"&&c.source!=="import")return false;
    return (c.id+" "+c.patient.name+" "+c.hospital+" "+c.village+" "+c.pkg.name).toLowerCase().includes(q);
  });
  document.getElementById("qlist").innerHTML=items.length?items.map(c=>{const st=stateOf(c),sg=stageOf(c);
    return `<li><a class="qitem" href="#${c.id}" ${sel===c.id?'aria-current="true"':""}>
      <span class="score s-${st.band}" aria-label="Risk ${st.score}">${st.score}</span>
      <span><span class="qname"><span>${esc(c.patient.name)}</span><span class="stage st-${sg}">${STAGE[sg]}</span></span>${c.reason?`<span class="qreason">${esc(c.reason)}</span>`:""}
      <span class="qmeta" style="display:block">${esc(c.pkg.name)} · ${esc(shortHosp(c.hospital))}</span></span></a></li>`;}).join("")
    :`<li class="qempty">No cases match. Clear the search or choose another filter.</li>`;
}

function renderCase(){
  const el=document.getElementById("case"),app=document.getElementById("app"),c=currentCase();
  if(!c){app.classList.remove("showing");el.innerHTML=welcomeView();return;}
  app.classList.add("showing");
  const st=stateOf(c),ns=nextStep(c,st),col=st.band==="high"?"var(--fail)":st.band==="med"?"var(--warn)":"var(--pass)";
  const tabs=[["review","Review"],["docs","Documents"],["field","Field visit"],["decide","Decide"]];
  el.innerHTML=`<div class="wrap">
    <button class="back" type="button" data-act="home">‹ All cases</button>
    <div class="head"><div>
      <h1>${esc(c.patient.name)}, ${c.patient.age}${esc(c.patient.gender)}</h1>
      <p class="sub">${esc(c.id)} · ${esc(c.hospital)} · ${esc(clientOf(c).name)}</p>
      <div class="meta"><div><span>Package</span> ${esc(c.pkg.name)}</div><div><span>Claimed</span> ${inr(c.claimAmount)}</div>
        <div><span>Stay</span> ${day(c.dates.admit)} to ${day(c.dates.discharge)}</div><div><span>Village</span> ${esc(c.village||c.district||"Not given")}</div>${c.reason?`<div><span>Audit reason</span> ${esc(c.reason)}</div>`:""}</div>
    </div>
    <div class="dial" style="--v:${st.score};--c:${col}" role="img" aria-label="Risk ${st.score} of 100, ${BAND[st.band]}"><div><span>Risk</span><b>${st.score}</b><span>${BAND[st.band]}</span></div></div></div>
    <div class="next ${ns.done?"done":""}"><div><p class="t">${esc(ns.t)}</p><p class="d">${esc(ns.d)}</p></div>${ns.label?`<button class="btn" data-act="${ns.act}">${esc(ns.label)}</button>`:""}</div>
    <div class="steps" role="tablist" aria-label="Audit steps">${tabs.map(([k,l],i)=>`<button class="step" role="tab" data-tab="${k}" aria-selected="${UI.tab===k}"><span class="n">${i+1}</span><span class="lb">${l}</span><span class="dot d-${tabDot(c,st,k)}"></span></button>`).join("")}</div>
    <div id="pane">${UI.tab==="review"?reviewView(c,st):UI.tab==="docs"?docsView(c):UI.tab==="field"?fieldView(c):decideView(c,st)}</div>
  </div>`;
}

function welcomeView(){
  const open=CLAIMS.filter(c=>!decisionOf(c)),high=open.filter(c=>stateOf(c).band==="high").length,first=nextCase(null);
  const nm=ME&&ME.name?ME.name.split(" ")[0]:"";
  return `<div class="welcome">
    <h1>${nm?`Good to see you, ${esc(nm)}.`:"Welcome to ClaimSure."}</h1>
    <p>${open.length?`${open.length} case${open.length>1?"s are":" is"} open${high?`, ${high} of them high risk`:""}. Start with the riskiest one.`:"Every case is decided. Nice work."}</p>
    ${first?`<button class="btn" data-open="${first.id}">Open ${esc(first.patient.name)}’s case</button>`:""}
    <ol class="how">
      <li><span class="n">1</span><span><b>Review</b><span>The app checks every claim document and ranks cases by risk.</span></span></li>
      <li><span class="n">2</span><span><b>Field visit</b><span>Photograph the hospital register and case sheet; they’re read and checked automatically. Then visit the patient.</span></span></li>
      <li><span class="n">3</span><span><b>Decide</b><span>The report fills itself in. Pick a decision and move to the next case.</span></span></li>
    </ol></div>`;
}

const ICON={fail:"✕",warn:"!",pass:"✓",pending:"…"};
function findCard(k){
  const tab=TAB_FOR[k.group];
  return `<div class="find"><span class="ico i-${k.status}" aria-hidden="true">${ICON[k.status]}</span>
    <div><div class="t">${esc(k.title)}<span class="tag">${esc(k.group)}</span>${/^NHA/.test(k.basis)?`<span class="tag nha" title="${esc(k.basis)}">NHA</span>`:/scheme rule$/.test(k.basis)?`<span class="tag nha" title="${esc(k.basis)}">${esc(k.basis.replace(/ scheme rule$/,""))}</span>`:""}</div><div class="d">${esc(k.detail)}</div>
    ${k.evidence.length?`<ul>${k.evidence.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:""}</div>
    ${tab&&k.status!=="pass"?`<button class="link" data-tab="${tab}">${tab==="docs"?"See documents":"Go to field visit"}</button>`:"<span></span>"}</div>`;
}
function reviewView(c,st){
  const by=s=>st.checks.filter(k=>k.status===s);
  const grp=(s,title)=>by(s).length?`<div class="group-h"><h2>${title}</h2><span class="count">${by(s).length}</span></div><div class="finds">${by(s).map(findCard).join("")}</div>`:"";
  const body=grp("fail","Problems found")+grp("warn","Needs a look")+grp("pending","Waiting on evidence");
  return (body||`<p class="hint">No problems found.</p>`)+(by("pass").length?`<details class="passed"><summary>Passed checks (${by("pass").length})</summary><div class="finds">${by("pass").map(findCard).join("")}</div></details>`:"");
}

function docsView(c){
  return deskForm(c)+docsDetail(c);
}
function docsDetail(c){
  const hr=c.hospitalRecord,pd=c.patientDocs;
  const rows=[["Name",c.patient.name,hr.name,pd.name],["Age",c.patient.age,hr.age,pd.age],["Sex",fmtVal("gender",c.patient.gender),fmtVal("gender",hr.gender),fmtVal("gender",pd.gender)],
    ["Masked Aadhaar","xxxx "+c.patient.aadhaar,"xxxx "+hr.aadhaar,"—"],["Diagnosis",c.diagnosis,hr.diagnosis,pd.diagnosis],["Procedure",c.pkg.name,hr.procedure,pd.procedure],
    ["Admitted",day(c.dates.admit),day(hr.admit),day(pd.admit)],["Discharged",day(c.dates.discharge),day(hr.discharge),day(pd.discharge)],
    ["Doctor",c.doctor,hr.doctor,pd.doctor],["Amount",inr(c.claimAmount),inr(hr.billAmount),"—"]];

    <tbody>${rows.map(r=>`<tr><th scope="row">${r[0]}</th><td>${esc(r[1])}</td>${cell(r[2],r[1])}${cell(r[3],r[1])}</tr>`).join("")}</tbody></table></div></div>
    ${pages.length?`<div class="section"><h2>Read from the hospital’s pages</h2><div class="slots">${pages.map(p=>`<div class="slot wide"><div class="slot-h"><b>${esc(slotOf(p.slot).label)}</b></div>${readCard(c,p)}</div>`).join("")}</div></div>`:""}
    ${docChecklist(c)}
    <div class="section"><h2>Files in the claim</h2>
    <div class="tablewrap"><table><thead><tr><th>File</th><th>Made with</th><th>Issued</th><th>Last edited</th><th>Stamp match</th><th>Fingerprint</th></tr></thead>
    <tbody>${c.files.length?"":`<tr><td colspan="6">No files attached yet. Imported cases start with the client’s case details only.</td></tr>`}${c.files.map(f=>`<tr><td>${esc(f.name)}</td><td class="${EDITORS.includes(f.producer)?"bad":""}">${esc(f.producer)}</td><td>${day(f.created)||"—"}</td><td>${day(f.modified)||"—"}</td><td class="${f.stamp!=null&&f.stamp<0.9?"bad":""}">${f.stamp==null?"—":Math.round(f.stamp*100)+"%"}</td><td class="${(hashIndex[f.hash]||[]).length>1?"bad":""}">${esc(f.hash)}</td></tr>`).join("")}</tbody></table></div>
    <p class="hint" style="margin-top:8px">In the full product these values come from scanning the uploaded files. Here they’re preset sample values.</p></div>`;

function docChecklist(c){
  const req=requiredDocs(c.pkg.code),ph=c.pharmacy||[];
  return `<div class="section"><h2>Required documents <span class="tag nha">NHA</span></h2>
    <p class="hint" style="margin:0 0 8px">What a ${esc(c.pkg.name)} claim must carry.${c.files.length?"":" Imported cases start without documents."}</p>
    <div class="doclist">${req.map(([l,re])=>{const f=c.files.find(x=>re.test(x.name));return `<span class="docitem ${f?"ok":c.files.length?"no":"wait"}">${f?"✓":c.files.length?"✕":"…"} ${esc(l)}</span>`;}).join("")}</div>
    ${c.bio?`<p style="margin:10px 0 0">Aadhaar biometric: admission ${c.bio.admit===false?"<b class=\"tf\">not done</b>":c.bio.admit?"done":"unknown"}, discharge ${c.bio.discharge===false?"<b class=\"tf\">not done</b>":c.bio.discharge?"done":"unknown"}.</p>`:""}
    ${ph.length?`<h3 style="margin:14px 0 6px;font-size:15px">Pharmacy bills</h3><div class="tablewrap"><table><thead><tr><th>Bill no.</th><th>Date</th><th>Amount</th></tr></thead><tbody>${ph.map(b=>`<tr><td>${esc(b.no)}</td><td>${day(b.date)}</td><td>${inr(b.amount)}</td></tr>`).join("")}</tbody></table></div>`:""}
  </div>`;
}
function readCard(c,p){
  if(p.id in READING)return `<div class="readcard"><p class="rc-h"><span><span class="spin"></span>Reading the page…</span><span class="rc-m" data-progress="${esc(p.id)}">${READING[p.id]||0}%</span></p></div>`;
  const r=readsOf(c.id)[p.id];

const RES={pass:["Pass","tp"],warn:["Needs a look","tw"],fail:["Failed","tf"],pending:["Waiting","tq"]};
const OUTSTANDING={
  "Page reading":"The admission register and case sheet have not been photographed and read yet.",
  "Visit evidence":"Visit photos have not been taken yet.",
  "Desk audit":"The desk audit checklist isn’t complete.",
  "Hospital fact sheet":"The hospital fact sheet hasn’t been filled at the hospital visit.",
  "Hospital records":"This patient’s entries in the hospital’s registers and case papers haven’t been checked.",
  "Home visit":"The home visit with the patient has not been done yet.",
  "Cross-check":"The patient’s own discharge papers have not been collected yet.",
  "File tampering":"The claim documents (bills, discharge summary) have not been attached yet.",
  "Visual consistency":"The claim documents have not been attached yet, so stamps can’t be compared.",
  "Scheme rules":"A scheme rule question has not been answered yet.",
  "Mandatory documents":"The claim documents have not been attached yet, so required documents can’t be checked.",
  "Document red flags":"The claim documents have not been attached yet, so bills can’t be checked.",
  "Package fit":"The claim data has no diagnosis, so the package can’t be checked against it."
};
function amountQuestioned(c,st){
  const fl=st.checks.filter(k=>k.status==="fail"),f=fl.map(k=>k.group);
  if(fl.some(isCrit))return {amt:c.claimAmount,why:"Full claim, because of fraud signals"};
  if(f.includes("Billing")){const ledger=Number(c.hospitalRecord.billAmount)||c.pkg.rate||c.claimAmount,base=Math.min(c.pkg.rate||ledger,ledger),x=c.claimAmount-base;
    if(x>0)return {amt:x,why:ledger<c.pkg.rate?"Billed above the hospital’s own ledger":"Billed above the package rate"};}
  return {amt:0,why:"No excess found"};
}
function evidenceLine(c){
  const ph=photosOf(c.id),req=SLOTS.filter(s=>s.req),have=req.filter(s=>ph.some(p=>p.slot===s.id)).length;
  const pages=ph.filter(p=>slotOf(p.slot).read),read=pages.filter(p=>readsOf(c.id)[p.id]).length;
  return {photos:`${have} of ${req.length} required photos`,visit:visitOf(c).status==="done"?"Home visit done":"Home visit pending",pages:`${read} of 2 hospital pages read`};
}
function checkText(k){
  if(k.status==="pending")return esc(OUTSTANDING[k.group]||k.detail);
  return esc(k.detail)+(k.evidence.length&&k.group!=="Page reading"?`<ul>${k.evidence.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:k.group==="Page reading"&&k.status!=="pass"?" See section 3.":"");
}
function reportView(c,st){
  const v=visitOf(c),dec=decisionOf(c),ph=photosOf(c.id),opt=dec&&OPTIONS.find(o=>o.v===dec.verdict),sg=suggest(st,c),aq=amountQuestioned(c,st),ev=evidenceLine(c);
  const cl=clientOf(c),f=factOf(c),m=mafOf(c)||{},dk=deskOf(c)||{},surg=isSurg(c);
  const fails=st.checks.filter(k=>k.status==="fail"),warns=st.checks.filter(k=>k.status==="warn"),pend=st.checks.filter(k=>k.status==="pending");
  const pages=ph.filter(p=>slotOf(p.slot).read&&readsOf(c.id)[p.id]);
  const today=day(new Date().toISOString().slice(0,10)),n=nights(c.dates.admit,c.dates.discharge);
  const YN=x=>x==="yes"?"Yes":x==="no"?`<b class="tf">No</b>`:`<span class="tq">Not answered</span>`;
  const YNi=x=>x==="yes"?`<b class="tw">Yes</b>`:x==="no"?"No":`<span class="tq">Not answered</span>`;
  const kf=[...fails,...warns].map(k=>{
    const pr=k.status==="fail"?`<span class="tagf tf">${isCrit(k)?"Fraud signal":"Failed"}:</span>`:`<span class="tagf tw">Needs a look:</span>`;
    if(k.group==="Page reading"){const cnt=pages.reduce((s,p)=>s+comparePage(c,p.slot,readsOf(c.id)[p.id].fields).filter(x=>x.st===k.status).length,0);
      return `<li>${pr} The hospital’s own register or case sheet ${k.status==="fail"?"contradicts":"doesn’t fully confirm"} the claim on ${cnt} detail${cnt===1?"":"s"} (Annexure E).</li>`;}

/* ---------- Actions ---------- */
async function addPhoto(c,slot,blob,sample){
  const hg=HOSP_GEO[c.hospital];
  const [hash,small,loc]=await Promise.all([fingerprint(blob),sample?blob:shrink(blob),sample?null:locate()]);
  const where=sample?(hg?{lat:+(hg[0]+(slotOf(slot).visit==="home"?0.06:0.0004)).toFixed(5),lng:+(hg[1]+(slotOf(slot).visit==="home"?0.05:0.0003)).toFixed(5),acc:12}:null):loc;
  const meta={id:`${c.id}/${slot}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`,caseId:c.id,slot,hash,time:new Date().toISOString(),
    lat:where?where.lat:null,lng:where?where.lng:null,acc:where?where.acc:null,auditor:ME?ME.name:"Demo auditor",size:small.size,sample:!!sample};
  const id=await PhotoStore.save(meta,small);
  await refreshPhotos();
  return {id,blob:small,located:!!where};
}
async function onCapture(c,input){
  const file=input.files&&input.files[0];if(!file)return;
  if(!file.type.startsWith("image/")){toast("That file isn’t a photo. Choose a JPG or PNG.",true);return;}
  try{toast("Saving the photo…");const r=await addPhoto(c,input.dataset.slot,file,false);renderAll();
    toast(r.located?"Photo saved.":"Photo saved without location. Allow location access to stamp where it was taken.",!r.located);
    const p=PHOTOS.find(x=>x.id===r.id);if(p&&slotOf(p.slot).read)readPhoto(c,p,r.blob);
  }catch(e){toast(e.message||"Couldn’t save the photo. Try again.",true);}
}
async function addSamples(c,part){
  const todo=SLOTS.filter(s=>s.visit===part&&s.req&&!photosOf(c.id).some(p=>p.slot===s.id)&&(!s.consent||consentOf(c.id)));
  if(!todo.length){toast("All required photos are already there.");return;}
  toast("Adding sample photos…");const reads=[];
  try{for(const s of todo){const blob=s.read?await samplePage(c,s.id):await sampleScene(c,s.id);const r=await addPhoto(c,s.id,blob,true);if(s.read)reads.push(r);}}
  catch(e){toast(e.message||"Couldn’t add sample photos.",true);}
  renderAll();
  for(const r of reads){const p=PHOTOS.find(x=>x.id===r.id);if(p)await readPhoto(c,p,r.blob);}
}
function saveDecision(c,openNext){
  const v=(document.querySelector('input[name="verdict"]:checked')||{}).value,note=document.getElementById("dnote").value.trim();
  if(!v){toast("Choose a recommendation first.",true);return;}
  const amtRaw=document.getElementById("damt").value,amount=amtRaw===""?"":Number(amtRaw);
  if(v==="Process with partial amount"&&(amount===""||amount<0||amount>c.claimAmount)){toast(`Enter a recommended approval amount between ₹0 and ${inr(c.claimAmount)}.`,true);return;}
  setCase(c.id,{decision:{verdict:v,note,amount:v==="Process with partial amount"?amount:"",by:ME?ME.name:"Auditor",at:new Date().toISOString()}});
  computeAll();renderTop();renderFilters();
  toast(`Decision saved: ${v}.`);
  if(openNext){const nx=nextCase(c);if(nx){UI.tab="review";location.hash=nx.id;return;}}
  renderAll();
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-open]");if(!b)return;const c=currentCase(),d=b.dataset;
  if(d.imp){
    if(d.imp==="open"){if(canImport())openImporter();return;}
    if(d.imp==="close"){document.getElementById("importer").close();return;}
    if(d.imp==="template"){download("claimsure-case-template.csv",templateCSV());return;}
    if(d.imp==="sample"){IMP.client="ap-trust";onImportFile(parseCSV(sampleBatchCSV()),"sample-batch-ntr-trust.csv");return;}
    if(d.imp==="back"){IMP.step=Math.max(1,IMP.step-1);renderImporter();return;}
    if(d.imp==="check"){IMP.checked=checkRows(IMP.table,IMP.map,IMP.client);IMP.step=3;renderImporter();return;}
    if(d.imp==="import"){doImport();return;}
    if(d.imp==="remove"){removeBatch(d.batch);return;}
    return;}
  if(d.filter){UI.filter=d.filter;renderFilters();renderQueue();return;}
  if(d.open){location.hash=d.open;return;}
  if(d.tab){UI.tab=d.tab;UI.editing=null;renderCase();window.scrollTo({top:0});return;}
  if(d.part){UI.part=d.part;renderCase();return;}
  if(d.lang){const fm=document.getElementById("visitForm");
    if(fm&&c){const fd=new FormData(fm),dr={};VISIT_KEYS.forEach(k=>{const x=fd.get(k);if(x!=null&&x!=="")dr[k]=x;});UI.draft={id:c.id,v:dr};}
    UI.lang=d.lang;renderCase();return;}
  if(!c&&d.act!=="home")return;
  if(d.act==="home"){location.hash="";return;}
  if(d.act==="docs"){UI.tab="docs";renderCase();setTimeout(()=>{const el=document.getElementById("deskform");if(el)el.scrollIntoView({block:"start"});},30);return;}
  if(d.act==="field"||d.act==="decide"){UI.tab=d.act;if(d.act==="field")UI.part=(missingSlots(c).some(s=>s.visit==="hospital")||missingRules(c).length||!factOf(c)||!mafDone(c))?"hospital":"home";renderCase();window.scrollTo({top:0});return;}
  if(d.act==="next"){const nx=nextCase(c);if(nx){UI.tab="review";location.hash=nx.id;}return;}
  if(d.act==="print"){window.print();return;}
  if(d.act==="savedec"){saveDecision(c,false);return;}
  if(d.act==="savenext"){saveDecision(c,true);return;}
  if(d.act==="savevisit"){
    const fd=new FormData(document.getElementById("visitForm"));
    if(!fd.get("availed")){toast("Answer the first question to save.",true);return;}
    const v={status:"done",form:"nha-annex4"};["availed","sameHosp","otherHosp","complaints","since","referred","refFrom","pAdmit","pDischarge","treatment","surgery","scar","food","postMeds","moneyAsked","purpose","receipts","ownCost","ownReceipt","dischargeSummary","notes"].forEach(k=>v[k]=String(fd.get(k)||"").trim());
    v.amount=Number(fd.get("amount")||0);
    UI.draft=null;setCase(c.id,{visit:v});renderAll();toast("Answers saved. Risk updated.");return;}
  if(d.act==="savedesk"||d.act==="desksuggest"){
    const fd=new FormData(document.getElementById("deskForm")),sg=deskSuggest(c),prev=deskOf(c)||{},dk={remarks:{}};
    DESK_QS.forEach(q=>{dk[q.id]=fd.get("d-"+q.id)||"";dk.remarks[q.id]=String(fd.get("r-"+q.id)||"").trim();
      if(d.act==="desksuggest"&&!dk[q.id]&&sg[q.id]){dk[q.id]=sg[q.id].a;if(!dk.remarks[q.id])dk.remarks[q.id]=sg[q.id].why;}});
    dk.by=ME?ME.name:(prev.by||"Desk doctor");dk.at=new Date().toISOString();
    setCase(c.id,{desk:dk});renderAll();
    toast(d.act==="desksuggest"?"ClaimSure’s answers filled in. Answer the rest.":deskDone(c)?"Desk audit saved.":"Saved. Some questions are still unanswered.");return;}
  if(d.act==="savefact"){
    const fd=new FormData(document.getElementById("factForm")),n=k=>fd.get(k)===""?"":Number(fd.get(k)),a={};
    FACT_ITEMS.forEach(([,it])=>it.forEach(([k])=>{a[k]=fd.get("f-"+k)||"";}));
    if(Object.values(a).some(x=>!x)){toast("Answer every Yes/No item on the fact sheet.",true);return;}
    const fact={date:fd.get("date"),hospType:fd.get("hospType"),response:fd.get("response"),tms:n("tms"),found:n("found"),beds:{general:n("bedsGeneral"),icu:n("bedsIcu"),hdu:n("bedsHdu")},ots:n("ots"),otTables:n("otTables"),
      undertaking:fd.get("undertaking")||"",signatory:String(fd.get("signatory")||"").trim(),a,by:ME?ME.name:"Field auditor",at:new Date().toISOString()};
    setCase("hosp:"+c.hospital,{fact});renderAll();toast(`Fact sheet saved for ${shortHosp(c.hospital)}. It applies to every case there.`);return;}
  if(d.act==="savemaf"){
    const fd=new FormData(document.getElementById("mafForm")),m={spec:String(fd.get("spec")||"").trim()};
    MAF_ITEMS.forEach(i=>{m[i.k]=fd.get("m-"+i.k)||"";});
    setCase(c.id,{maf:m});renderAll();toast(mafDone(c)?"Case records saved.":"Saved. Some items are still unanswered.");return;}
  if(d.act==="resetvisit"){UI.draft=null;if(saved[c.id]){delete saved[c.id].visit;persist();}renderAll();toast("Reset to the sample answers.");return;}
  if(d.sample){b.disabled=true;await addSamples(c,d.sample);return;}
  if(d.read){const p=PHOTOS.find(x=>x.id===d.read);if(p)readPhoto(c,p);return;}
  if(d.fixedit){UI.editing=d.fixedit;renderCase();return;}
  if(d.fixcancel){UI.editing=null;renderCase();return;}
  if(d.fixsave){
    const reads=Object.assign({},readsOf(c.id)),r=Object.assign({},reads[d.fixsave]),f=Object.assign({},r.fields);
    document.querySelectorAll("[data-fix]").forEach(inp=>{const k=inp.dataset.fix,val=inp.value.trim();
      f[k]=k==="age"?(val===""?null:Number(val)):k==="gender"?(/^f/i.test(val)?"F":/^m/i.test(val)?"M":""):(k==="admit"||k==="discharge")?toISO(val)||val:val;});
    r.fields=f;r.corrected=true;reads[d.fixsave]=r;setCase(c.id,{reads});UI.editing=null;renderAll();toast("Corrections saved.");return;}
  if(d.view){const p=PHOTOS.find(x=>x.id===d.view),dl=document.getElementById("viewer");if(!p)return;
    dl.querySelector("img").src=p.src;dl.querySelector("img").alt=slotOf(p.slot).label;
    dl.querySelector("p").innerHTML=`<b>${esc(slotOf(p.slot).label)}</b><br>${stampText(c,p)}<br>Fingerprint ${esc(String(p.hash).slice(0,12))}…`;dl.showModal();return;}
  if(d.del){if(!confirm("Remove this photo from the case?"))return;
    try{await PhotoStore.remove(d.del);const reads=Object.assign({},readsOf(c.id));delete reads[d.del];setCase(c.id,{reads});await refreshPhotos();renderAll();toast("Photo removed.");}
    catch(err){toast(err.message,true);}return;}
});
document.addEventListener("change",e=>{
  if(e.target.name==="impclient"){IMP.client=e.target.value;return;}
  if(e.target.id==="impfile"&&e.target.files[0]){onImportFile(e.target.files[0]);return;}
  if(e.target.dataset.map){const v=e.target.value;if(v==="")delete IMP.map[e.target.dataset.map];else{const i=Number(v);Object.keys(IMP.map).forEach(k=>{if(IMP.map[k]===i)delete IMP.map[k];});IMP.map[e.target.dataset.map]=i;}renderImporter();return;}
  const c=currentCase();if(!c)return;
  if(e.target.dataset.rule){const ra=Object.assign({},ruleAnswers(c.id),{[e.target.dataset.rule]:e.target.value});setCase(c.id,{rules:ra});renderAll();toast("Answer saved. Risk updated.");return;}
  if(e.target.matches("input[data-slot]"))onCapture(c,e.target);
  if(e.target.id==="consent"){setCase(c.id,{consent:e.target.checked});renderCase();}
});
document.getElementById("search").addEventListener("input",e=>{UI.query=e.target.value;renderQueue();});
window.addEventListener("hashchange",()=>{UI.tab="review";UI.editing=null;renderAll();window.scrollTo({top:0});});

(async()=>{
  computeAll();renderTop();renderFilters();renderQueue();renderCase();
  await loadCaps();await PhotoStore.init();await refreshPhotos();renderAll();
})();
fetch("/api/me",{credentials:"same-origin"}).then(r=>r.ok?r.json():null).then(u=>{
  if(!u)return;ME=u;const w=document.getElementById("me");
  w.innerHTML=`<span class="avatar" aria-hidden="true">${esc(u.name.split(" ").map(x=>x[0]).join("").slice(0,2))}</span><span><span class="nm">${esc(u.name)}</span><span class="rl">${esc(u.role)}</span></span><a href="/logout">Sign out</a>`;
  w.hidden=false;renderFilters();if(!currentCase())renderCase();
}).catch(()=>{});

</script>
</body>
</html>
