name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy with Wrangler 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx -y wrangler@4 deploy 2>&1 | tee deploy.log; then
            grep -vE '^\s*$' deploy.log | tail -15 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -Eo 'https://[^ ]+workers\.dev' deploy.log | head -1 | sed 's/^/::notice::Live at /'
